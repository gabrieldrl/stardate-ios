name: Stardate
options:
  bundleIdPrefix: com.gabrieldrl
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  defaultConfig: Debug
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
  configs:
    Debug:
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
    Release:
      SWIFT_OPTIMIZATION_LEVEL: "-O"
targets:
  Stardate:
    type: application
    platform: iOS
    sources:
      - path: StardateApp
      - path: Shared
    settings:
      base:
        CODE_SIGN_IDENTITY: Apple Development
        CODE_SIGN_STYLE: Automatic
        PRODUCT_BUNDLE_IDENTIFIER: com.gabrieldrl.stardate
        PRODUCT_NAME: Stardate
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_CFBundleDisplayName: Stardate
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: true
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: true
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_EMIT_LOC_STRINGS: true
    dependencies:
      - target: StardateWidget
        embed: true
  StardateWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: StardateWidget
      - path: Shared
    settings:
      base:
        CODE_SIGN_IDENTITY: Apple Development
        CODE_SIGN_STYLE: Automatic
        PRODUCT_BUNDLE_IDENTIFIER: com.gabrieldrl.stardate.widget
        PRODUCT_NAME: StardateWidget
        INFOPLIST_FILE: StardateWidget/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Stardate Widget
        INFOPLIST_KEY_NSExtension_NSExtensionPointIdentifier: com.apple.widgetkit-extension
        APPLICATION_EXTENSION_API_ONLY: true
        SKIP_INSTALL: true
        SWIFT_EMIT_LOC_STRINGS: true
  StardateTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: StardateTests
    dependencies:
      - target: Stardate
    settings:
      base:
        CODE_SIGN_IDENTITY: Apple Development
        CODE_SIGN_STYLE: Automatic
        PRODUCT_BUNDLE_IDENTIFIER: com.gabrieldrl.stardate.tests
        GENERATE_INFOPLIST_FILE: true
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Stardate.app/Stardate"
        BUNDLE_LOADER: "$(TEST_HOST)"
